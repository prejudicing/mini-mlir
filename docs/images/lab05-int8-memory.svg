<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc">
<title id="title">INT8 DRAM：位宽变化会改变地址</title><desc id="desc">仍使用 64 字节对齐。C 为 INT32，所以大小没有缩小。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">INT8 DRAM：位宽变化会改变地址</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">仍使用 64 字节对齐。C 为 INT32，所以大小没有缩小。</text>
<rect x="90.0" y="165" width="393.3333333333333" height="120" rx="15" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="110.0" y="200" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#2563eb">A：INT8</text>
<text x="110.0" y="236" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172b4d">起点 0 · 有效 35 字节</text>
<text x="110.0" y="270" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">5 × 7 × 1</text>
<rect x="503.3333333333333" y="165" width="393.3333333333333" height="120" rx="15" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="523.3333333333333" y="200" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#059669">B：INT8</text>
<text x="523.3333333333333" y="236" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172b4d">起点 64 · 有效 42 字节</text>
<text x="523.3333333333333" y="270" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">7 × 6 × 1</text>
<path d="M483.3333333333333,145 L483.3333333333333,159" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="916.6666666666666" y="165" width="393.3333333333333" height="120" rx="15" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="936.6666666666666" y="200" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#7c3aed">C：INT32</text>
<text x="936.6666666666666" y="236" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172b4d">起点 128 · 有效 120 字节</text>
<text x="936.6666666666666" y="270" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">5 × 6 × 4</text>
<path d="M896.6666666666666,145 L896.6666666666666,159" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#526580">DMA 偏移必须乘以真实元素字节数，不能继续统一乘 4。</text>
<text x="42" y="368" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
