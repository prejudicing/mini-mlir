<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">为什么使用 Adaptor</title><desc id="desc">转换后的加法应引用转换后常量的结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">为什么使用 Adaptor</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">转换后的加法应引用转换后常量的结果。</text>
<rect x="45" y="130" width="600" height="235" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<text x="73" y="172" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#2563eb">转换前的依赖</text>
<text x="73" y="219" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">toy.constant → %oldA</text>
<text x="73" y="258" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">toy.constant → %oldB</text>
<text x="73" y="297" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">toy.add(%oldA, %oldB)</text>
<rect x="790" y="130" width="600" height="235" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<text x="818" y="172" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#059669">转换后的依赖</text>
<text x="818" y="219" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">arith.constant → %newA</text>
<text x="818" y="258" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">arith.constant → %newB</text>
<text x="818" y="297" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">arith.addi(%newA, %newB)</text>
<path d="M670,220.0 L765,220.0" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="385" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#526580">adaptor.getLhs()/getRhs() 提供已重映射的操作数。</text>
<text x="42" y="418" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
