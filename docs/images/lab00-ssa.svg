<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">SSA：名字连接的是计算结果</title><desc id="desc">%a、%b、%c 是 Value；箭头代表某个结果被后续 Operation 使用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">SSA：名字连接的是计算结果</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">%a、%b、%c 是 Value；箭头代表某个结果被后续 Operation 使用。</text>
<rect x="55" y="140" width="285" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="55" y="140" width="285" height="9" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="197.5" y="187" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2563eb">constant 10</text>
<text x="197.5" y="226" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">结果：%a : i32</text>
<rect x="55" y="315" width="285" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="55" y="315" width="285" height="9" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="197.5" y="362" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7c3aed">constant 20</text>
<text x="197.5" y="401" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">结果：%b : i32</text>
<rect x="560" y="215" width="300" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="560" y="215" width="300" height="9" rx="4" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="710.0" y="262" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#059669">arith.addi</text>
<text x="710.0" y="301" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">输入：%a、%b</text>
<text x="710.0" y="332" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">结果：%c : i32</text>
<rect x="1080" y="215" width="300" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="1080" y="215" width="300" height="9" rx="4" fill="#d97706" stroke="#d97706" stroke-width="2"/>
<text x="1230.0" y="262" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#d97706">func.return</text>
<text x="1230.0" y="301" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">使用：%c</text>
<path d="M345,205 L550,260" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="447.5" y="220.5" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526580">%a</text>
<path d="M345,380 L550,310" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="447.5" y="333.0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526580">%b</text>
<path d="M870,290 L1065,290" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="967.5" y="278.0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526580">%c</text>
<text x="42" y="518" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
