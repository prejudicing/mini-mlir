<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img" aria-labelledby="title desc">
<title id="title">INT8 量化：把连续实数映射到离散格点</title><desc id="desc">示例 scale=0.5、zero point=0；每前进一个整数格，代表实数增加 0.5。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">INT8 量化：把连续实数映射到离散格点</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">示例 scale=0.5、zero point=0；每前进一个整数格，代表实数增加 0.5。</text>
<path d="M100,250 L1340,250" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M180,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="180" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">-1.5</text>
<text x="180" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=-3</text>
<path d="M360,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="360" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">-1</text>
<text x="360" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=-2</text>
<path d="M540,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="540" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">-0.5</text>
<text x="540" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=-1</text>
<path d="M720,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="720" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">0</text>
<text x="720" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=0</text>
<path d="M900,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="900" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">0.5</text>
<text x="900" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=1</text>
<path d="M1080,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="1080" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">1</text>
<text x="1080" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=2</text>
<path d="M1260,238 v24" stroke="#2563eb" stroke-width="3"/>
<text x="1260" y="212" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#2563eb">1.5</text>
<text x="1260" y="303" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#172b4d">q=3</text>
<text x="720" y="365" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#172b4d">0.75 / 0.5 = 1.5 → 舍入到偶数 2 → 反量化为 1.0</text>
<text x="42" y="428" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
