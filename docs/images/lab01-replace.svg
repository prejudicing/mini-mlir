<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">replaceOp 改的是使用关系</title><desc id="desc">不需要按 SSA 名字搜索并手动修改后面的文本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">replaceOp 改的是使用关系</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">不需要按 SSA 名字搜索并手动修改后面的文本。</text>
<rect x="45" y="130" width="600" height="235" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<text x="73" y="172" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#2563eb">替换前</text>
<text x="73" y="219" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">%b = addi %a, %zero</text>
<text x="73" y="258" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">%c = addi %b, %zero</text>
<text x="73" y="297" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">return %c</text>
<rect x="790" y="130" width="600" height="235" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<text x="818" y="172" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#059669">替换 %b 之后</text>
<text x="818" y="219" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">第一条 addi 被删除</text>
<text x="818" y="258" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">%c = addi %a, %zero</text>
<text x="818" y="297" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b4d">return %c</text>
<path d="M670,220.0 L765,220.0" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="385" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#526580">所有使用 %b 的地方自动改为使用 %a。</text>
<text x="42" y="418" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
