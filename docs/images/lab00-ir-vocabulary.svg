<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">读懂一条 arith.addi</title><desc id="desc">%c = arith.addi %a, %b : i32</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">读懂一条 arith.addi</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">%c = arith.addi %a, %b : i32</text>
<rect x="45" y="125" width="660" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="45" y="125" width="660" height="9" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="375.0" y="172" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2563eb">Operation</text>
<text x="375.0" y="211" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">arith.addi 是一次加法操作</text>
<text x="375.0" y="242" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">Operation 不是计算后的整数</text>
<rect x="735" y="125" width="660" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="735" y="125" width="660" height="9" rx="4" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="1065.0" y="172" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#059669">Operand</text>
<text x="1065.0" y="211" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">%a 和 %b 是输入 Value</text>
<text x="1065.0" y="242" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">Value 连接定义者与使用者</text>
<rect x="45" y="295" width="660" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="45" y="295" width="660" height="9" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="375.0" y="342" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7c3aed">Result</text>
<text x="375.0" y="381" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">%c 是这个操作产生的 Value</text>
<text x="375.0" y="412" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">一个 Op 可以有零个或多个结果</text>
<rect x="735" y="295" width="660" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="735" y="295" width="660" height="9" rx="4" fill="#d97706" stroke="#d97706" stroke-width="2"/>
<text x="1065.0" y="342" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#d97706">Type</text>
<text x="1065.0" y="381" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">i32 表示 32 位整数类型</text>
<text x="1065.0" y="412" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">Type 描述值的表示方式</text>
<text x="42" y="478" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
