<text x="995.1999999999999" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#d97706">Greedy Rewrite</text>
<text x="995.1999999999999" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">维护工作列表</text>
<path d="M841.5999999999999,220 L872.5999999999999,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1155.8" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="1155.8" y="145" width="229.2" height="9" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="1270.3999999999999" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2563eb">AddZeroPattern</text>
<text x="1270.3999999999999" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">匹配并替换</text>
<path d="M1116.8,220 L1147.8,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="343" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#526580">Pattern 匹配失败表示此规则不适用，通常不是整个编译失败。</text>
