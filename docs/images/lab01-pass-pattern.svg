<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">规则、Pass 和驱动器各自做什么</title><desc id="desc">一个 Pattern 负责一个局部替换；驱动器负责多次尝试。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">规则、Pass 和驱动器各自做什么</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">一个 Pattern 负责一个局部替换；驱动器负责多次尝试。</text>
<rect x="55.0" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="55.0" y="145" width="229.2" height="9" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="169.6" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2563eb">main</text>
<text x="169.6" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">解析输入 IR</text>
<rect x="330.2" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="330.2" y="145" width="229.2" height="9" rx="4" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="444.79999999999995" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#059669">PassManager</text>
<text x="444.79999999999995" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">安排 Pass</text>
<path d="M291.2,220 L322.2,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="605.4" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="605.4" y="145" width="229.2" height="9" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="720.0" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7c3aed">Simplify Pass</text>
<text x="720.0" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">准备规则集合</text>
<path d="M566.4,220 L597.4,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="880.5999999999999" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
