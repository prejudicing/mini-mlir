<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">一个 tile 如何执行</title><desc id="desc">DRAM 保存完整矩阵，SRAM 保存这次计算所需的小块。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1440" height="100%" rx="20" fill="#f5f8fd"/>
<text x="42" y="53" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#172b4d">一个 tile 如何执行</text>
<text x="42" y="91" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526580">DRAM 保存完整矩阵，SRAM 保存这次计算所需的小块。</text>
<rect x="55.0" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="55.0" y="145" width="229.2" height="9" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="169.6" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2563eb">LOAD A/B</text>
<text x="169.6" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">搬入输入小块</text>
<rect x="330.2" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="330.2" y="145" width="229.2" height="9" rx="4" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="444.79999999999995" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#059669">LOAD C</text>
<text x="444.79999999999995" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">读取已有部分和</text>
<path d="M291.2,220 L322.2,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="605.4" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="605.4" y="145" width="229.2" height="9" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="720.0" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7c3aed">MATMUL</text>
<text x="720.0" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">累加到 C tile</text>
<path d="M566.4,220 L597.4,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="880.5999999999999" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="880.5999999999999" y="145" width="229.2" height="9" rx="4" fill="#d97706" stroke="#d97706" stroke-width="2"/>
<text x="995.1999999999999" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#d97706">STORE C</text>
<text x="995.1999999999999" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">把部分和写回</text>
<path d="M841.5999999999999,220 L872.5999999999999,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1155.8" y="145" width="229.2" height="150" rx="15" fill="#fff" stroke="#d7e1f1" stroke-width="2"/>
<rect x="1155.8" y="145" width="229.2" height="9" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="1270.3999999999999" y="192" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2563eb">下一个 tile</text>
<text x="1270.3999999999999" y="231" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">重用 SRAM 区域</text>
<path d="M1116.8,220 L1147.8,220" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="343" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#526580">跨 K 分块必须保留 C；每次清零会丢失前面的结果。</text>
<text x="42" y="378" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526580">MLIR 学习实验 · 图解教程</text>
</svg>
