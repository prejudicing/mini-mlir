<title id="title">Lab06 · PyTorch → Mini NPU：文件结构与职责</title>
<desc id="desc">文件树左侧展示源码路径，右侧说明用途；不介绍 Markdown/HTML 文档，不展开 build 生成目录和图片资源。</desc>
