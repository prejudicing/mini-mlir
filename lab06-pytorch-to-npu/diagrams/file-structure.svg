<text class="tree" xml:space="preserve" x="48" y="754" font-size="21" fill="#0f172a" font-weight="400">├── requirements.txt</text>
<text x="770" y="754" font-size="21" fill="#334155">声明独立环境中的 CPU PyTorch、NumPy 依赖版本</text>
<rect x="32" y="767" width="1836" height="42" rx="5" fill="#eaf0f8"/>
<text class="tree" xml:space="preserve" x="48" y="796" font-size="21" fill="#0f172a" font-weight="400">└── run.py</text>
